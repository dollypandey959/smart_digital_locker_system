<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HR Profile</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0d1117;font-family:Arial,sans-serif;}
.wrap{max-width:750px;margin:40px auto;background:#161b22;padding:28px;border-radius:14px;border:1px solid #30363d;}
.title{color:#58a6ff;font-weight:700;font-size:20px;margin-bottom:22px;text-align:center;letter-spacing:1px;}
.row-item{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #21262d;}
.label{color:#8b949e;font-size:14px;}
.value{font-weight:600;color:#e6edf3;font-size:14px;}
.btn-blue{background:#1f6feb;color:#fff;border:none;padding:11px 28px;border-radius:8px;font-weight:600;cursor:pointer;display:block;margin:22px auto 0;}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:10;align-items:center;justify-content:center;}
.overlay.open{display:flex;}
.modal{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:28px;width:420px;max-width:95vw;}
.modal h5{color:#e6edf3;font-size:16px;font-weight:700;margin-bottom:18px;}
.modal input{width:100%;background:#0d1117;border:1px solid #30363d;color:#e6edf3;padding:9px 12px;border-radius:7px;font-size:14px;margin-bottom:10px;outline:none;}
.modal input:focus{border-color:#388bfd;}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:8px;}
.btn-cancel{background:transparent;border:1px solid #30363d;color:#8b949e;padding:9px 18px;border-radius:7px;cursor:pointer;}
.btn-save{background:#1f6feb;color:#fff;border:none;padding:9px 18px;border-radius:7px;font-weight:600;cursor:pointer;}
.modal-close{background:none;border:none;color:#8b949e;font-size:20px;cursor:pointer;float:right;}
</style>
</head>
<body>

<div class="wrap">
  <div class="title">HR PROFILE</div>
  <div class="row-item"><span class="label">Full Name</span><span class="value">{{ user[1] }}</span></div>
  <div class="row-item"><span class="label">Email</span><span class="value">{{ user[2] }}</span></div>
  <div class="row-item"><span class="label">Login ID</span><span class="value">{{ user[3] }}</span></div>
  <div class="row-item"><span class="label">Role</span><span class="value">{{ user[5] }}</span></div>
  <div class="row-item"><span class="label">Status</span><span class="value">{{ user[6] }}</span></div>
  <div class="row-item"><span class="label">Department</span><span class="value">{{ user[7] }}</span></div>
  <div class="row-item"><span class="label">Designation</span><span class="value">{{ user[8] }}</span></div>
  <div class="row-item"><span class="label">Phone</span><span class="value">{{ user[9] }}</span></div>
  <div class="row-item"><span class="label">Address</span><span class="value">{{ user[10] }}</span></div>
  <button class="btn-blue" onclick="document.getElementById('editOverlay').classList.add('open')">Edit Profile</button>
</div>

<div class="overlay" id="editOverlay">
  <div class="modal">
    <button class="modal-close" onclick="document.getElementById('editOverlay').classList.remove('open')">&#x2715;</button>
    <h5>Edit Profile</h5>
    <form method="POST">
      <input type="text" name="full_name" value="{{ user[1] }}" placeholder="Full Name">
      <input type="email" name="email" value="{{ user[2] }}" placeholder="Email">
      <input type="text" name="phone" value="{{ user[9] }}" placeholder="Phone">
      <input type="text" name="department" value="{{ user[7] }}" placeholder="Department">
      <input type="text" name="designation" value="{{ user[8] }}" placeholder="Designation">
      <input type="text" name="address" value="{{ user[10] }}" placeholder="Address">
      <div class="modal-footer">
        <button type="button" class="btn-cancel" onclick="document.getElementById('editOverlay').classList.remove('open')">Cancel</button>
        <button type="submit" class="btn-save">Save Changes</button>
      </div>
    </form>
  </div>
</div>

</body>
</html>
