<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | HRMS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0d1117;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;}
.card{background:#161b22;border:1px solid #30363d;border-radius:18px;padding:38px 36px;width:100%;max-width:420px;}
.icon-wrap{width:64px;height:64px;background:#1f2d3d;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;}
.icon-wrap svg{width:28px;height:28px;stroke:#388bfd;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
h3{color:#e6edf3;font-size:22px;font-weight:700;text-align:center;margin-bottom:8px;}
.sub{color:#8b949e;font-size:14px;text-align:center;margin-bottom:26px;}
.alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:18px;}
.alert-success{background:#1c2a1c;border:1px solid #2ea043;color:#3fb950;}
.alert-danger{background:#2d1a1a;border:1px solid #f85149;color:#f85149;}
label{color:#8b949e;font-size:13px;display:block;margin-bottom:6px;}
input{width:100%;background:#0d1117;border:1px solid #30363d;color:#e6edf3;padding:10px 14px;border-radius:8px;font-size:14px;outline:none;transition:border .2s;}
input:focus{border-color:#388bfd;}
input::placeholder{color:#484f58;}
.btn{width:100%;background:#1f6feb;color:#fff;border:none;padding:12px;border-radius:9px;font-size:15px;font-weight:600;cursor:pointer;margin-top:20px;transition:background .2s;}
.btn:hover{background:#388bfd;}
.back{text-align:center;margin-top:18px;}
.back a{color:#58a6ff;font-size:13px;text-decoration:none;}
.back a:hover{text-decoration:underline;}
</style>
</head>
<body>

<div class="card">
  <div class="icon-wrap">
    <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
  </div>
  <h3>Forgot Password</h3>
  <p class="sub">Enter your Login ID to receive a reset link</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{category}}">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="POST" action="{{ url_for('forgot_password') }}">
    <div style="margin-bottom:14px;">
      <label>Login ID</label>
      <input type="text" name="login_id" placeholder="Enter HR / Employee ID" required>
    </div>
    <button type="submit" class="btn">Send Reset Link</button>
  </form>

  <div class="back">
    <a href="{{ url_for('login') }}">&#8592; Back to Login</a>
  </div>
</div>

</body>
</html>
